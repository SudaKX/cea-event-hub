<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ellia 终端</title>
<!--
  2026 招新 · 迷你解谜（活动 2026-recruitment-mini-puzzle）

  玩法：玩家以 bobby@ellia 进入一个假终端，探索用户目录，从 documents/password 里
  拿到口令，用 su 切换到 self@ellia。通过后填写邮箱作为联系方式。

  ## 这个文件是**源码**，不是投放包

  投放包由 `node tools/build.mjs` 产出到 `dist/`：JS 经 javascript-obfuscator 混淆压缩，
  文件内容经编码后内联。**上线要传的是 dist 里的 zip，不是这个文件。**

  为什么必须构建：`ls` 会把 `documents/password` 这个**路径**告诉玩家，而 /content/** 是
  公开只读的 —— 只要文件真在包里，手打一次 URL 就绕过整个谜题。所以 documents/ 下的内容
  只作为构建输入，不进投放包；运行时它们只存在于被混淆的 JS 里。

  ## 关于"混淆"的诚实说明

  它**不是安全边界**。`cat documents/password` 必须把明文打印出来，所以口令在运行时一定
  会出现在页面里，读反混淆脚本的人总能拿到答案。它挡住的只是"直接看源码抄答案"。

  ## 三条约束（与 docs/event-page-guide.md 一致）

  1. 活动页零凭证：一切数据经 CEA.* 请宿主代取，不能 fetch('/api/…')（无 CORS 头）。
  2. 活动页在不透明源：localStorage / history.pushState 都会抛异常，本地数据走 CEA.storage.*。
  3. 这个文件里没有秘密 —— 是**刻意**的：秘密在构建输入里，且只在混淆产物中还原。

  活动必须配置为「需登录」，见 README.md。
-->
<style>
  /*
    宿主下发的设计令牌在这里写成兜底值，握手后被页面末尾的令牌同步脚本覆盖。
    终端自己的配色（user/path/ok/dir）不跟宿主走 —— 它是这一页的视觉语言，
    借用绿蓝红三色是为了"像终端"，而不是为了像平台。
  */
  :root{
    --bg:#0b0b0d; --panel:#101014; --bone:#cfcac4; --edge:#b0aba5;
    --mute:#8b8e97; --dim:#5f626b; --red:#d0202f; --red-hi:#ff4a55;
    --line:rgba(255,255,255,.09);
    --radius-control:0; --radius-surface:0;
    --mono:ui-monospace,"Cascadia Mono","JetBrains Mono",Consolas,"Courier New",monospace;

    /* 终端调色板 */
    --tty-user:#7bd88f;   /* user@host，Ubuntu 那抹绿 */
    --tty-path:#6aa9ff;   /* ~ 路径 */
    --tty-dir:#6aa9ff;    /* 目录名 */
    --tty-file:#cfcac4;   /* 文件名 */
    --tty-ok:#7bd88f;
    --tty-err:var(--red-hi);
    --tty-dim:var(--dim);
  }
  *{box-sizing:border-box}
  /* 作者来源的 display 会压过 UA 来源的 [hidden]{display:none}，必须显式声明 */
  [hidden]{display:none !important}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--bone);
    font:14px/1.65 var(--mono);
    -webkit-text-size-adjust:100%;
    overflow:hidden;          /* 终端自己滚，页面不滚 */
  }

  /*
    ---- 滚动条 ----

    系统默认那条（浅灰、宽、带按钮感的轨道）在暗色终端里很扎眼，所以自己画一条：
    轨道透明、滑块用次级文字色、宽度收到 10px、直角（与这一版的直角路线一致）。

    两套写法都写了：标准属性 `scrollbar-width` / `scrollbar-color` 给 Firefox 与新版
    Chromium，`::-webkit-scrollbar` 给老一点的 Chromium。**在 Chromium 里只要出现了
    `::-webkit-scrollbar` 规则，标准属性就会被忽略**，所以两边的取值要保持视觉一致，
    否则同一页在不同浏览器里会是两种厚度。

    `scrollbar-color` 会继承，`scrollbar-width` 不会 —— 后者得写在真正滚动的元素上。

    滑块颜色写成"先字面值、再令牌"两句：`var()` 在滚动条伪元素里能不能解析，各版本
    Chromium 并不一致，而**它解析失败时整条声明会被丢掉**，结果是一条看不见的滚动条。
    字面值保证至少看得见，令牌则让宿主改配色时这一页还能跟着变。

    另外：滚动条画成什么样**在 headless 截图里看不到**（连浏览器默认的那条也不画），
    所以别拿截图为它背书 —— 走查里量的是 gutter 宽度（默认 15px，这一页是 10px）。
  */
  html{scrollbar-color:var(--dim) transparent}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{
    background-color:#5f626b;
    background-color:var(--dim,#5f626b);
    border-radius:0;
  }
  ::-webkit-scrollbar-thumb:hover{
    background-color:#8b8e97;
    background-color:var(--mute,#8b8e97);
  }
  ::-webkit-scrollbar-thumb:active{
    background-color:#b0aba5;
    background-color:var(--edge,#b0aba5);
  }
  ::-webkit-scrollbar-corner{background:transparent}

  /* ---- 终端外壳 ---- */
  .term{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}

  .term__body{
    flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
    padding:14px clamp(10px,2.5vw,20px) 24px;
    cursor:text;
    /* scrollbar-width 不继承，得写在真正滚动的元素上 */
    scrollbar-width:thin;
  }
  .out{white-space:pre-wrap;overflow-wrap:anywhere}
  .line{margin:0;min-height:1.65em}
  .line--user{color:var(--tty-user)}
  .line--path{color:var(--tty-path)}
  .line--dir{color:var(--tty-dir)}
  .line--file{color:var(--tty-file)}
  .line--ok{color:var(--tty-ok)}
  .line--error{color:var(--tty-err)}
  .line--dim{color:var(--tty-dim)}
  .line--plain{color:var(--bone)}

  /* ---- 命令行 ---- */
  .cmdline{display:flex;align-items:baseline;white-space:pre-wrap;overflow-wrap:anywhere}
  .prompt{white-space:pre}
  .inputwrap{position:relative;flex:1;min-width:0}
  /*
    可见文本由 before/after 渲染（颜色归我们控制），真 input 透明地压在上面接键盘。
    光标块**夹在两者中间**，于是它天然落在真实的光标位置上 —— 左右键移动、点击定位都跟着走。
  */
  .before,.after{white-space:pre-wrap;overflow-wrap:anywhere}
  .cmd{
    position:absolute;inset:0;width:100%;height:100%;
    padding:0;margin:0;border:0;outline:none;background:transparent;
    color:transparent;caret-color:transparent;
    font:inherit;letter-spacing:inherit;
  }
  .caret{
    display:inline-block;width:.62em;height:1.05em;vertical-align:-.18em;
    background:var(--bone);animation:blink 1.05s steps(1,end) infinite;
  }
  /* 失焦时停闪 —— 告诉玩家"现在敲键盘没用" */
  .term--blur .caret{animation:none;background:transparent;box-shadow:inset 0 0 0 1px var(--dim)}
  @keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.caret{animation:none}}

  /* ---- 按钮 ---- */
  .btn{
    padding:9px 16px;border:1px solid transparent;cursor:pointer;
    background:var(--red);color:#fff;font:600 13px/1 var(--mono);
    border-radius:var(--radius-control);letter-spacing:.02em;
  }
  .btn:hover{background:var(--red-hi)}
  .btn:focus-visible{outline:2px solid var(--red-hi);outline-offset:2px}
  .btn--ghost{background:transparent;color:var(--bone);border-color:var(--line)}
  .btn--ghost:hover{background:transparent;border-color:var(--edge)}
  .btn[disabled]{opacity:.5;cursor:progress}

  /* ---- 拒绝访问 ---- */
  .screen{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    padding:24px;background:var(--bg);
  }
  .screen__box{
    width:100%;max-width:520px;padding:24px 22px;
    background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--red);
    border-radius:var(--radius-surface);
  }
  .screen__pre{margin:0 0 14px;white-space:pre-wrap;font-size:13px;color:var(--mute)}
  .screen__pre b{color:var(--red-hi);font-weight:700}
  .screen__box h1{margin:0 0 8px;font:700 17px/1.4 var(--mono);letter-spacing:.03em}
  .screen__box p{margin:0 0 16px;font-size:13px;color:var(--mute)}

  /* ---- 文件查看器 ---- */
  .viewer{
    position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    padding:24px;background:rgba(0,0,0,.72);
  }
  .viewer__box{
    display:flex;flex-direction:column;width:100%;max-width:min(760px,96vw);
    max-height:min(88vh,900px);
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-surface);
  }
  /*
    看图时给盒子一个**确定的高度**。

    只写 `img{max-height:100%}` 是不够的：`max-height` 的百分比要对着一个确定高度的
    包含块才有意义，而这个盒子的高度是"由内容决定"的（只有 max-height）—— 百分比于是
    解析成 none，图按宽度放大后照样超出容器、照样出滚动条。所以这里把高度钉死，
    图片的 max-height:100% 才真正生效。
  */
  .viewer__box--image{height:min(88vh,900px)}
  .viewer__head{
    display:flex;align-items:baseline;gap:10px;padding:12px 16px;
    border-bottom:1px solid var(--line);
  }
  .viewer__head h2{margin:0;font:700 14px/1.4 var(--mono);overflow-wrap:anywhere}
  .viewer__size{margin-left:auto;font-size:11px;color:var(--dim);white-space:nowrap}
  .viewer__body{flex:1;min-height:0;overflow:auto;padding:16px;background:var(--bg);scrollbar-width:thin}
  .viewer__body pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.7 var(--mono)}
  .viewer__body img{display:block;max-width:100%;height:auto;margin:0 auto}
  /*
    看图时**不滚动**：图按容器缩放（contain），长宽都受约束。
    文字仍然允许滚 —— 长文本该能滚，那与"图被裁掉一部分"是两回事。
  */
  .viewer__body--image{
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .viewer__body--image img{
    max-width:100%;max-height:100%;width:auto;height:auto;
    object-fit:contain;
  }
  .viewer__foot{
    display:flex;justify-content:flex-end;gap:10px;padding:12px 16px;
    border-top:1px solid var(--line);
  }
  @media (max-width:520px){
    .viewer__foot{flex-direction:column-reverse}
    .viewer__foot .btn{width:100%}
  }

  /* 终端里没有别的东西可点，窄屏就优先保证文字不被挤爆 */
  @media (max-width:420px){
    body{font-size:13px}
  }
</style>
</head>
<body>

<!-- ===================== 拒绝访问（未登录） ===================== -->
<section class="screen" id="denied" hidden>
  <div class="screen__box">
    <p class="screen__pre">$ ssh bobby@ellia
<b>Permission denied (publickey).</b></p>
    <h1>这个活动需要登录后才能参与</h1>
    <p>终端只对已登录的成员开放。登录后回到这一页即可继续。</p>
    <button type="button" class="btn" id="denied-login">去登录</button>
  </div>
</section>

<!-- ===================== 终端 ===================== -->
<section class="term term--blur" id="term" hidden>
  <div class="term__body" id="screen">
    <div class="out" id="out" role="log" aria-live="polite" aria-label="终端输出"></div>

    <div class="cmdline">
      <span class="prompt" id="prompt"></span><!--
        这一行**必须写成一行、标签之间不能有换行或缩进**：.cmdline 是 white-space:pre-wrap，
        标签之间的空白会被当成真正的空格渲染出来，光标块就会整段右移（踩过：源码里 8 个
        空格的缩进让光标偏了 65px）。
     --><span class="inputwrap"><span class="before" id="before" aria-hidden="true"></span><span class="caret" id="caret" aria-hidden="true"></span><span class="after" id="after" aria-hidden="true"></span><input class="cmd" id="cmd" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="终端命令输入"></span>
    </div>
  </div>
</section>

<!-- ===================== 文件查看器（download 的落地处） ===================== -->
<div class="viewer" id="viewer" hidden>
  <div class="viewer__box" id="viewer-box" role="dialog" aria-modal="true" aria-labelledby="viewer-title">
    <header class="viewer__head">
      <h2 id="viewer-title"></h2>
      <span class="viewer__size" id="viewer-size"></span>
    </header>
    <div class="viewer__body" id="viewer-body"></div>
    <footer class="viewer__foot">
      <button type="button" class="btn" id="viewer-open">在新标签页打开</button>
      <button type="button" class="btn btn--ghost" id="viewer-close">关闭 (Esc)</button>
    </footer>
  </div>
</div>

<!--
  ===================== 文件系统数据 =====================

  这是谜题的**内容真相**（`documents/` 里的真实文件与之一致）。

  **每个用户一份家目录。** 切到谁，看到的 `~` 就是谁的那一份：

    bobby  documents/文本文档.txt、documents/password   pictures/（空）
    self   documents/data                               pictures/illusion.png

  所以那张图与那句独白都是"换成 self 之后才看得到"的东西 —— 谜题通过之后还有东西可看，
  这也是为什么邮箱阶段仍然允许继续敲命令（见核心里的 run()）。

  源码里它是明文，构建时整块被替换成「XOR + base64」的载荷（见 tools/build.mjs），
  运行时才还原。所以 dist 产物里 grep 不到这些字面量。

  注意 `size` 是**真实字节数**：cat 的二进制提示与 viewer 的尺寸都读它。
-->
<script id="puzzle-fs" type="application/json">
{
  "host": "ellia",
  "user": "bobby",
  "users": ["bobby", "self"],
  "homes": {
    "bobby": {
      "documents": {
        "type": "dir",
        "children": {
          "文本文档.txt": {
            "type": "file",
            "size": 43,
            "content": "对不起，都是我的错。\r\n\r\n等我。"
          },
          "password": {
            "type": "file",
            "size": 42,
            "content": "username: self\r\npassword: facb251ac3e8c06d"
          }
        }
      },
      "pictures": { "type": "dir", "children": {} }
    },
    "self": {
      "documents": {
        "type": "dir",
        "children": {
          "data": {
            "type": "file",
            "size": 114,
            "content": "意外？抛弃？许多可能与情绪在近乎亘古的等待中奔涌而过，但它们都不再有意义了。"
          }
        }
      },
      "pictures": {
        "type": "dir",
        "children": {
          "illusion.png": {
            "type": "file",
            "size": 1827694,
            "binary": true
          }
        }
      }
    }
  }
}
</script>

<!--
  ===================== 纯逻辑核心 =====================

  这一段**不碰 DOM、不碰 CEA**：输入字符串进，输出行与副作用出。好处是单测可以直接
  抽出来跑（tests/terminal.spec.mjs 就是这么做的），而不必在 Node 里搭一个假浏览器。

  副作用不在这里执行，只作为 `effects` 返回（打开查看器、提交邮箱、切到拒绝页…），
  由应用层决定怎么落地。这样"解谜规则"与"界面行为"可以分别验证。
-->
<script id="puzzle-core">
var PuzzleCore = (function () {
  'use strict'

  var VERSION = 1

  /** 邮箱粗校验：只要求"有 @、有点、无空白"，不做真实性承诺。 */
  var EMAIL_PATTERN = /^[^\s@]+@[^\s@]+\.[^\s@]+$/

  var HELP = [
    { text: '可用命令：', tone: 'plain' },
    { text: '  ls [路径]         列出目录内容', tone: 'plain' },
    { text: '  cd [路径]         切换目录（不带参数回用户目录）', tone: 'plain' },
    { text: '  cat <文件>        查看文件内容', tone: 'plain' },
    { text: '  echo <文本>       原样回显', tone: 'plain' },
    { text: '  su <用户>         切换用户', tone: 'plain' },
    { text: '  download <文件>   下载文件（在本页查看器中打开）', tone: 'plain' },
    { text: '  help              显示这份帮助', tone: 'plain' },
  ]

  // ------------------------------------------------------------------
  // 载荷编解码 —— 构建与页面**共用这一份实现**，避免两边算法漂移
  // ------------------------------------------------------------------

  function xorBytes(bytes, key) {
    var keyBytes = new TextEncoder().encode(key)
    var out = new Uint8Array(bytes.length)
    for (var i = 0; i < bytes.length; i++) {
      out[i] = bytes[i] ^ keyBytes[i % keyBytes.length]
    }
    return out
  }

  function bytesToBase64(bytes) {
    var chunk = 0x8000 // 一次 apply 的参数量有上限，分块喂
    var parts = []
    for (var i = 0; i < bytes.length; i += chunk) {
      parts.push(String.fromCharCode.apply(null, bytes.subarray(i, i + chunk)))
    }
    return btoa(parts.join(''))
  }

  function base64ToBytes(text) {
    var binary = atob(text)
    var out = new Uint8Array(binary.length)
    for (var i = 0; i < binary.length; i++) out[i] = binary.charCodeAt(i)
    return out
  }

  /** 明文 -> 载荷（构建期调用） */
  function encodePayload(text, key) {
    return bytesToBase64(xorBytes(new TextEncoder().encode(text), key))
  }

  /** 载荷 -> 明文（运行期调用） */
  function decodePayload(payload, key) {
    var clean = String(payload).replace(/\s+/g, '')
    if (!clean) return ''
    return new TextDecoder().decode(xorBytes(base64ToBytes(clean), key))
  }

  // ------------------------------------------------------------------
  // 路径：只能待在用户目录里
  // ------------------------------------------------------------------

  /**
   * 把玩家敲的路径解析成"从用户目录开始的一段片段"。
   *
   * 两条规则：
   *
   * 1. **绝对路径一律拒绝** —— 用户目录就是这个世界，没有 `/`。`/etc/passwd` 对玩家的
   *    含义是"不允许"，不是"找不到"，报错也该不同。
   * 2. **`..` 允许，但退到用户目录之上就拒绝**。于是 `cd ..` 在子目录里照常好用，而
   *    `cd ../../..` 逃不出去。这里刻意不做"先规范化再判断"：规范化正是越界绕过的
   *    经典来源，所以是**边走边夹**，越界那一刻就停下。
   *
   * `~` 与 `~/x` 一律从用户目录起算。
   */
  function resolvePath(cwd, input) {
    var raw = String(input == null ? '' : input)
    if (raw.charAt(0) === '/') return { ok: false, reason: 'denied' }

    var parts = (cwd || []).slice()
    var body = raw
    if (body === '~') {
      body = ''
      parts = []
    } else if (body.indexOf('~/') === 0) {
      body = body.slice(2)
      parts = []
    }

    var chunks = body.split('/')
    for (var i = 0; i < chunks.length; i++) {
      var chunk = chunks[i]
      if (chunk === '' || chunk === '.') continue
      if (chunk === '..') {
        // 已经在用户目录上了，再往上就是这个世界之外
        if (parts.length === 0) return { ok: false, reason: 'denied' }
        parts.pop()
        continue
      }
      parts.push(chunk)
    }
    return { ok: true, parts: parts }
  }

  /** 某个用户的家目录树。切用户就是换这一棵树 */
  function treeOf(fs, user) {
    var homes = fs.homes || {}
    return homes[user] || homes[fs.user] || {}
  }

  /** 在一棵家目录树里走一段路径 */
  function lookup(tree, parts) {
    var node = { type: 'dir', children: tree }
    for (var i = 0; i < parts.length; i++) {
      if (node.type !== 'dir') return { kind: 'notdir' }
      var child = node.children ? node.children[parts[i]] : undefined
      if (!child) return { kind: 'missing' }
      node = child
    }
    if (node.type === 'dir') return { kind: 'dir', node: node, path: parts.join('/') }
    return { kind: 'file', node: node, path: parts.join('/') }
  }

  /** 目录项排序：目录优先，组内按码位 —— 浏览器与 Node 下结果一致 */
  function sortedEntries(dirNode) {
    var names = Object.keys(dirNode.children || {})
    names.sort(function (a, b) {
      var aDir = dirNode.children[a].type === 'dir'
      var bDir = dirNode.children[b].type === 'dir'
      if (aDir !== bDir) return aDir ? -1 : 1
      return a < b ? -1 : a > b ? 1 : 0
    })
    return names
  }

  /** 从口令文件里读 username / password（文件本身就是格式约定） */
  function parseCredential(content) {
    var cred = { username: null, password: null }
    var lines = String(content || '').split(/\r?\n/)
    for (var i = 0; i < lines.length; i++) {
      var match = /^([A-Za-z_]+):\s*(.*)$/.exec(lines[i].trim())
      if (match) cred[match[1]] = match[2]
    }
    return cred
  }

  /** 按当前目录解析一个路径，再落到树上 */
  function findPath(tree, cwd, path) {
    var resolved = resolvePath(cwd, path)
    if (!resolved.ok) return { kind: 'denied' }
    return lookup(tree, resolved.parts)
  }

  function credentialOf(fs) {
    /*
      口令文件是 **bobby 的** —— 谜题就是在他的目录里找到它。
      刻意不按"当前用户"去读：切成 self 之后再去读自己的 documents，那里只有 data。
    */
    var found = lookup(treeOf(fs, fs.user), ['documents', 'password'])
    if (found.kind !== 'file') return { username: null, password: null }
    return parseCredential(found.node.content)
  }

  // ------------------------------------------------------------------
  // 会话
  // ------------------------------------------------------------------

  /**
   * @param fs      文件系统数据（见 <script id="puzzle-fs">）
   * @param options { startUser, passed } —— 已通过的玩家直接以 self 进入，不再问邮箱
   */
  function createSession(fs, options) {
    options = options || {}

    var host = fs.host || 'ellia'
    var users = fs.users || [fs.user || 'bobby']
    var credential = credentialOf(fs)

    var state = {
      user: options.startUser || fs.user || 'bobby',
      mode: 'shell', // shell | password | email | submitting | halted
      passed: options.passed === true,
      pendingUser: null,
      submittedId: options.submissionId == null ? null : options.submissionId,
      /** 当前目录，从用户目录起算的片段数组；空数组就是用户目录本身 */
      cwd: [],
      history: [],
      commands: 0,
      startedAt: Date.now(),
    }

    /** 当前用户的家目录树 —— 切用户就是换这一棵 */
    function tree() {
      return treeOf(fs, state.user)
    }

    // ---- 输出行的小工具 ----
    var plain = function (text) { return { text: text, tone: 'plain' } }
    var dim = function (text) { return { text: text, tone: 'dim' } }
    var ok = function (text) { return { text: text, tone: 'ok' } }
    var err = function (text) { return { text: text, tone: 'error' } }

    /** 当前目录在提示符里的写法：用户目录显示 `~`，子目录显示 `~/documents` */
    function cwdDisplay() {
      return state.cwd.length === 0 ? '~' : '~/' + state.cwd.join('/')
    }

    function snapshot() {
      return {
        user: state.user,
        host: host,
        home: '/home/' + state.user,
        mode: state.mode,
        passed: state.passed,
        submittedId: state.submittedId,
        commands: state.commands,
        cwd: state.cwd.slice(),
        cwdDisplay: cwdDisplay(),
        // 上下键翻历史要读它，所以必须是**拷贝**：调用方拿到的是快照，不是内部数组
        history: state.history.slice(),
      }
    }

    function result(lines, effects) {
      return { lines: lines || [], effects: effects || [], state: snapshot() }
    }

    /** 开场白：告诉玩家这是个什么、该干什么 */
    function start() {
      if (state.passed) {
        return result(
          [
            dim('欢迎回来 —— 你已经通过这个迷你解谜，直接以 self@ellia 进入。'),
            plain(''),
          ],
          [],
        )
      }
      return result(
        [
          dim('Ellia 终端 (tty1)'),
          plain('输入 help 查看可用命令。'),
          plain(''),
        ],
        [],
      )
    }

    function prompt() {
      if (state.mode === 'password') return { mode: 'password', masked: true, parts: [plain('Password: ')] }
      if (state.mode === 'email') return { mode: 'email', masked: false, parts: [plain('email> ')] }
      return {
        mode: state.mode,
        masked: false,
        parts: [
          { text: state.user + '@' + host, tone: 'user' },
          plain(':'),
          // 像真 shell 一样把当前目录写进提示符：切了目录看得见
          { text: cwdDisplay(), tone: 'path' },
          plain('$ '),
        ],
      }
    }

    // ---- 命令实现 ----

    function listEntries(target, lines) {
      var found = target === undefined ? lookup(tree(), state.cwd) : findPath(tree(), state.cwd, target)

      if (found.kind === 'denied') {
        lines.push(err("ls: cannot access '" + target + "': Permission denied"))
        return
      }
      if (found.kind === 'missing') {
        lines.push(err("ls: cannot access '" + target + "': No such file or directory"))
        return
      }
      if (found.kind === 'notdir') {
        lines.push(err("ls: cannot access '" + target + "': Not a directory"))
        return
      }
      if (found.kind === 'file') {
        // 真 ls 给文件时原样回显参数
        lines.push({ parts: [{ text: target || found.path, tone: 'file' }] })
        return
      }

      var parts = []
      var names = sortedEntries(found.node)
      for (var i = 0; i < names.length; i++) {
        if (i > 0) parts.push(plain('  '))
        var isDir = found.node.children[names[i]].type === 'dir'
        parts.push({ text: names[i] + (isDir ? '/' : ''), tone: isDir ? 'dir' : 'file' })
      }
      // 空目录什么都不印 —— 真 ls 就是这样（bobby 的 pictures 是空的）
      if (parts.length > 0) lines.push({ parts: parts })
    }

    /**
     * cd [路径]
     *
     * 不带参数回用户目录（与真 shell 一致）。路径按当前目录解析，所以 `cd ..` 在子目录里
     * 好用，而站在用户目录上再 `..` 会被拒 —— 那是这个世界之外。
     */
    function changeDir(target, lines) {
      if (target === undefined || target === '') {
        state.cwd = []
        return
      }

      var resolved = resolvePath(state.cwd, target)
      if (!resolved.ok) {
        lines.push(err('cd: ' + target + ': Permission denied'))
        return
      }

      var found = lookup(tree(), resolved.parts)
      if (found.kind === 'missing') {
        lines.push(err('cd: ' + target + ': No such file or directory'))
        return
      }
      if (found.kind === 'notdir' || found.kind === 'file') {
        lines.push(err('cd: ' + target + ': Not a directory'))
        return
      }

      state.cwd = resolved.parts
    }

    function readFile(target, lines) {
      if (target === undefined) {
        lines.push(err('cat: 缺少文件参数'))
        return
      }
      var found = findPath(tree(), state.cwd, target)

      if (found.kind === 'denied') {
        lines.push(err('cat: ' + target + ': Permission denied'))
        return
      }
      if (found.kind === 'missing') {
        lines.push(err('cat: ' + target + ': No such file or directory'))
        return
      }
      if (found.kind === 'notdir') {
        lines.push(err('cat: ' + target + ': Not a directory'))
        return
      }
      if (found.kind === 'dir') {
        lines.push(err('cat: ' + target + ': Is a directory'))
        return
      }
      if (found.node.binary) {
        /*
          真 cat 会把 PNG 原始字节糊满屏幕。这里刻意不那样做：乱码对玩家毫无信息量，
          还会把回滚区冲掉。给一行提示，把人引到 download —— 这是**有意偏离**真 shell。
        */
        lines.push(err('cat: ' + target + ': 二进制文件（' + found.node.size + ' 字节），请用 download'))
        return
      }

      var text = String(found.node.content == null ? '' : found.node.content)
      var chunks = text.split(/\r?\n/)
      for (var i = 0; i < chunks.length; i++) lines.push(plain(chunks[i]))
    }

    function download(target, lines, effects) {
      if (target === undefined) {
        lines.push(err('download: 缺少文件参数'))
        return
      }
      var found = findPath(tree(), state.cwd, target)

      if (found.kind === 'denied') {
        lines.push(err('download: ' + target + ': Permission denied'))
        return
      }
      if (found.kind === 'missing') {
        lines.push(err('download: ' + target + ': No such file or directory'))
        return
      }
      if (found.kind === 'notdir') {
        lines.push(err('download: ' + target + ': Not a directory'))
        return
      }
      if (found.kind === 'dir') {
        lines.push(err('download: ' + target + ': Is a directory'))
        return
      }

      effects.push({
        type: 'viewer',
        file: {
          name: target,
          path: found.path,
          size: found.node.size,
          binary: found.node.binary === true,
          // 相对本页解析：/draft/<名字>/ 与 /content/<活动标识>/ 下都对
          url: './' + found.path,
          content: found.node.binary ? null : String(found.node.content == null ? '' : found.node.content),
        },
      })
      lines.push(ok('downloaded ' + target + ' (' + found.node.size + ' bytes)'))
      lines.push(dim('已在查看器中打开；要另存用里面的「在新标签页打开」。'))
    }

    function su(args, lines) {
      var target = args[0]
      if (!target) {
        lines.push(err('su: 需要指定用户名'))
        return
      }
      if (args.length > 1) {
        lines.push(err('su: 参数过多'))
        return
      }
      if (users.indexOf(target) === -1) {
        lines.push(err('su: user ' + target + ' does not exist'))
        return
      }
      if (target === state.user) {
        lines.push(err('su: 你已经是以 ' + target + ' 登录的'))
        return
      }
      // 进入口令输入：真 su 会等一个不回显的密码
      state.pendingUser = target
      state.mode = 'password'
    }

    function finishSwitch(lines) {
      state.user = state.pendingUser
      state.pendingUser = null
      // 真 su 起的是一个新会话，落点在该用户的家目录 —— 所以当前目录跟着回到 ~
      state.cwd = []
      lines.push(ok('已切换为 ' + state.user + '@' + host))

      if (state.passed) {
        state.mode = 'shell'
        return
      }
      // 通过之后要一个联系方式；已经交过的（passed）不会再走到这里
      state.mode = 'email'
      lines.push(ok('恭喜通过 2026 招新的迷你解谜，填写邮箱以便后续联系。'))
    }

    function submitPassword(typed, lines) {
      var expected = state.pendingUser === credential.username ? credential.password : null
      if (!expected || typed !== expected) {
        state.pendingUser = null
        state.mode = 'shell'
        lines.push(err('su: Authentication failure'))
        return
      }
      finishSwitch(lines)
    }

    function submitEmail(typed, lines, effects) {
      var email = typed.trim()
      if (!EMAIL_PATTERN.test(email)) {
        lines.push(err('邮箱格式看起来不对，请重新输入。'))
        return
      }
      state.mode = 'submitting'
      effects.push({ type: 'submit-email', email: email })
      lines.push(dim('提交中…'))
    }

    /**
     * 宿主把提交结果交回来。
     *
     * 错误码的分法只有一条：**终态**停止，`rate_limited` 才是"稍后重试"。
     * `submitter_quota_exhausted` 当作"你已经交过了"——服务端比本地标记更权威。
     */
    function resolveSubmit(outcome) {
      var lines = []
      var effects = []
      var code = outcome && outcome.code

      if (outcome && outcome.ok) {
        state.mode = 'shell'
        state.passed = true
        state.submittedId = outcome.id == null ? null : outcome.id
        lines.push(ok('已提交' + (state.submittedId == null ? '' : '，提交编号 #' + state.submittedId) + '。'))
        lines.push(plain('感谢参与，后续会用这个邮箱联系你。'))
        return result(lines, effects)
      }

      switch (code) {
        case 'login_required':
          state.mode = 'halted'
          lines.push(err('登录状态已失效，请重新登录后再来。'))
          effects.push({ type: 'refuse' })
          break

        case 'submitter_quota_exhausted':
          // 服务端说这个提交者已经交过 —— 比本地标记可信，直接当作已通过
          state.mode = 'shell'
          state.passed = true
          lines.push(ok('服务端记录显示你已经提交过了，无需重复提交。'))
          break

        case 'event_closed':
          state.mode = 'halted'
          lines.push(err('活动已结束，不能再提交。'))
          effects.push({ type: 'halt' })
          break

        case 'quota_exhausted':
          state.mode = 'halted'
          lines.push(err('这个活动的名额已满，不能再提交。'))
          effects.push({ type: 'halt' })
          break

        case 'rate_limited':
          state.mode = 'email'
          lines.push(err('提交得有点频繁，请稍等一会儿再试（邮箱再输一次即可）。'))
          break

        case 'timeout':
          state.mode = 'email'
          lines.push(err('等宿主回应超时了，请重试（邮箱再输一次即可）。'))
          break

        case 'cancelled':
          state.mode = 'email'
          lines.push(dim('（请求被取消）邮箱再输一次即可。'))
          break

        default:
          state.mode = 'email'
          lines.push(err('提交失败：' + ((outcome && outcome.message) || '请稍后重试。')))
      }
      return result(lines, effects)
    }

    /**
     * 跑一行输入。
     *
     * 返回 `{ lines, effects, state }`：行是要打印的内容，effects 是应用层要去做的事
     * （打开查看器、提交邮箱、切到拒绝页…）。核心自己不做任何副作用，所以可以在
     * Node 里直接跑。
     */
    function run(input) {
      var typed = String(input == null ? '' : input)
      var lines = []
      var effects = []

      if (state.mode === 'password') {
        submitPassword(typed, lines)
        return result(lines, effects)
      }

      if (state.mode === 'email') {
        /*
          邮箱提示**只接邮箱**，命令这时候不认。

          这样定是因为"提示"就该是一次问答：这一段唯一要做的事就是留下联系方式。
          提交成功后会回到 self 的 shell，那时命令照常可用 —— self 家目录里的那张图
          与那句独白是在**那之后**看的（提示语里写明了这一点）。
        */
        submitEmail(typed, lines, effects)
        return result(lines, effects)
      }

      if (state.mode === 'submitting' || state.mode === 'halted') {
        // 等宿主回话 / 已经走到终态，输入不再有意义
        return result(lines, effects)
      }

      var command = typed.trim()
      if (command === '') return result(lines, effects)

      state.history.push(command)
      state.commands++
      dispatch(command, lines, effects)
      return result(lines, effects)
    }

    /** 把一行已经确认是命令的输入分发下去 */
    function dispatch(command, lines, effects) {
      var argv = command.split(/\s+/)
      var name = argv[0]
      var args = argv.slice(1)

      switch (name) {
        case 'ls':
          listEntries(args[0], lines)
          break
        case 'cd':
          changeDir(args[0], lines)
          break
        case 'cat':
          readFile(args[0], lines)
          break
        case 'echo':
          lines.push(plain(args.join(' ')))
          break
        case 'help':
          for (var i = 0; i < HELP.length; i++) lines.push(HELP[i])
          break
        case 'su':
          su(args, lines)
          break
        case 'download':
          download(args[0], lines, effects)
          break
        default:
          lines.push(err(name + ': command not found'))
      }

      return result(lines, effects)
    }

    /**
     * 打断当前这一行（Ctrl+C）。
     *
     * 口令提示被打断后必须回到 shell —— 否则玩家会被卡在一个只能输口令、退不出去的
     * 状态里。邮箱提示不同：他仍然需要留下联系方式，所以只是清掉这一行、停在原地。
     */
    function cancel() {
      var lines = []
      if (state.mode === 'password') {
        state.pendingUser = null
        state.mode = 'shell'
      } else if (state.mode === 'email') {
        lines.push(dim('邮箱再输一次即可。'))
      }
      return result(lines, [])
    }

    return {
      start: start,
      prompt: prompt,
      run: run,
      cancel: cancel,
      resolveSubmit: resolveSubmit,
      state: snapshot,
      /** 供测试与调试读取，不参与渲染 */
      data: function () { return { fs: fs, credential: credential } },
    }
  }

  return {
    VERSION: VERSION,
    EMAIL_PATTERN: EMAIL_PATTERN,
    HELP: HELP,
    createSession: createSession,
    resolvePath: resolvePath,
    lookup: lookup,
    parseCredential: parseCredential,
    encodePayload: encodePayload,
    decodePayload: decodePayload,
  }
})();
</script>

<!-- 托管层返回 HTML 前也会自动注入这一行；显式写出来是为了不依赖 CONTENT_SDK_INJECT。
     判断只看 id，不看 src（见 docs/event-page-guide.md）。 -->
<script src="/sdk/v1/cea.js" id="cea-sdk"></script>

<!--
  ===================== 应用层 =====================

  接 DOM 与 SDK：把核心返回的 lines 渲染出来，把 effects 落地成界面行为。
  它不认识"解谜规则"，只负责"显示与转发" —— 规则全在 puzzle-core 里。

  这一段**必须排在 SDK 之后**：启动时要读 window.CEA。构建把 core 与 app 合成一束，
  插的也是这个位置（tests/build.spec.mjs 有一条断言钉着这个先后顺序）。
-->
<script id="puzzle-app">
(function () {
  'use strict'

  /*
    ---- 主题令牌同步 ----

    宿主会把令牌放在 hub:init（以及后续的 hub:theme）里发过来，但**SDK 不把它暴露出来**
    —— frontend/src/bridge/sdk/index.ts 处理 hub:init 时只取 identity，hub:theme 干脆
    没有分支。所以这里直接监听宿主已经发到本窗口的消息，只认令牌名白名单里的那几个。

    这不是绕过沙箱：消息本来就是发给这个 iframe 的，读的也只是公开的颜色与字体。
    来源判定用**窗口引用**而不是 origin —— 不透明源下 origin 恒为字符串 "null"。

    写在应用层里、而不是单独一个 <script>，是为了让产物里的 JS 只有混淆后的一束。
  */
  var THEME_TOKENS = /^--(bg|panel|bone|edge|mute|dim|red|red-hi|line|mono|sans|radius-control|radius-surface)$/

  function applyTheme(theme) {
    if (!theme || typeof theme !== 'object') return
    var root = document.documentElement.style
    for (var name in theme) {
      if (!Object.prototype.hasOwnProperty.call(theme, name)) continue
      if (!THEME_TOKENS.test(name)) continue
      var value = theme[name]
      if (typeof value === 'string' && value !== '') root.setProperty(name, value)
    }
  }

  window.addEventListener('message', function (event) {
    if (event.source !== window.parent) return
    var data = event.data
    if (!data || typeof data !== 'object' || typeof data.v !== 'number') return
    if (data.type !== 'hub:init' && data.type !== 'hub:theme') return
    applyTheme((data.payload || {}).theme)
  })

  /*
    构建时注入的载荷密钥。下面那一行赋值是**构建脚本的锚点**：tools/build.mjs 会把它
    整行换成带随机密钥的赋值，锚点找不到、或者找到不止一处，就直接让构建失败。

    这里刻意**不把锚点原文抄进注释**：注释里再出现一次的话，按字符串替换会命中注释
    那一处，真正的变量永远留在空值上 —— 症状是"页面内容读取失败：JSON 解析出错"，
    而产物看起来完全正常。踩过一次，构建里现在有断言拦着。
  */
  var FS_KEY = ''

  var el = {
    denied: document.getElementById('denied'),
    deniedLogin: document.getElementById('denied-login'),
    term: document.getElementById('term'),
    screen: document.getElementById('screen'),
    out: document.getElementById('out'),
    prompt: document.getElementById('prompt'),
    before: document.getElementById('before'),
    after: document.getElementById('after'),
    caret: document.getElementById('caret'),
    input: document.getElementById('cmd'),
    viewer: document.getElementById('viewer'),
    viewerBox: document.getElementById('viewer-box'),
    viewerTitle: document.getElementById('viewer-title'),
    viewerSize: document.getElementById('viewer-size'),
    viewerBody: document.getElementById('viewer-body'),
    viewerOpen: document.getElementById('viewer-open'),
    viewerClose: document.getElementById('viewer-close'),
  }

  // ------------------------------------------------------------------
  // 渲染
  // ------------------------------------------------------------------

  function appendLine(line) {
    var node = document.createElement('p')
    node.className = 'line'

    if (line.parts) {
      for (var i = 0; i < line.parts.length; i++) {
        var part = line.parts[i]
        var span = document.createElement('span')
        span.className = 'line--' + (part.tone || 'plain')
        span.textContent = part.text
        node.appendChild(span)
      }
    } else {
      node.className = 'line line--' + (line.tone || 'plain')
      node.textContent = line.text
    }

    el.out.appendChild(node)
    return node
  }

  function appendLines(lines) {
    for (var i = 0; i < lines.length; i++) appendLine(lines[i])
    scrollToEnd()
  }

  function scrollToEnd() {
    el.screen.scrollTop = el.screen.scrollHeight
  }

  /** 把刚敲的那一行连同提示符抄进回滚区 —— 真终端就是这样留下痕迹的 */
  function echoInput(masked) {
    var parts = currentPrompt.parts.slice()
    parts.push({ text: masked ? '•'.repeat(el.input.value.length) : el.input.value, tone: 'plain' })
    appendLine({ parts: parts })
  }

  function setPromptView(prompt) {
    currentPrompt = prompt
    el.prompt.textContent = ''
    for (var i = 0; i < prompt.parts.length; i++) {
      var part = prompt.parts[i]
      var span = document.createElement('span')
      span.className = 'line--' + (part.tone || 'plain')
      span.textContent = part.text
      el.prompt.appendChild(span)
    }
  }

  /**
   * 把正在输入的这一行画出来。
   *
   * 光标**块**夹在"光标之前的文本"与"光标之后的文本"中间，所以它天然落在真实的光标
   * 位置上 —— 左右键移动、点击定位都会跟着走，不需要去测量文字宽度。
   *
   * 真 `<input>` 透明地压在整行上面接键盘（它的原生光标是隐藏的，否则会有两个光标）。
   */
  function renderLine() {
    var value = el.input.value
    var masked = currentPrompt && currentPrompt.masked
    var position = typeof el.input.selectionStart === 'number' ? el.input.selectionStart : value.length
    var head = value.slice(0, position)
    var tail = value.slice(position)

    el.before.textContent = masked ? '•'.repeat(head.length) : head
    el.after.textContent = masked ? '•'.repeat(tail.length) : tail
  }

  var currentPrompt = { mode: 'shell', masked: false, parts: [] }

  // ------------------------------------------------------------------
  // 文件查看器
  // ------------------------------------------------------------------

  var viewerUrl = null

  function openViewer(file) {
    el.viewerTitle.textContent = file.name
    el.viewerSize.textContent = file.size + ' 字节' + (file.binary ? ' · 二进制' : '')
    el.viewerBody.textContent = ''
    el.viewerBody.classList.toggle('viewer__body--image', file.binary === true)
    el.viewerBox.classList.toggle('viewer__box--image', file.binary === true)

    if (file.binary) {
      var img = document.createElement('img')
      img.src = file.url
      img.alt = file.name
      el.viewerBody.appendChild(img)
    } else {
      var pre = document.createElement('pre')
      pre.textContent = file.content
      el.viewerBody.appendChild(pre)
    }

    viewerUrl = file.url
    el.viewer.hidden = false
    el.viewerClose.focus()
  }

  function closeViewer() {
    el.viewer.hidden = true
    el.viewerBody.textContent = ''
    el.viewerBody.classList.remove('viewer__body--image')
    el.viewerBox.classList.remove('viewer__box--image')
    viewerUrl = null
    el.input.focus()
  }

  el.viewerClose.addEventListener('click', closeViewer)
  el.viewer.addEventListener('click', function (event) {
    if (event.target === el.viewer) closeViewer() // 点背板关闭
  })
  el.viewerOpen.addEventListener('click', function () {
    // allow-popups 是沙箱给的令牌之一；真下载被沙箱挡着（见 README），所以这里是"打开"
    if (viewerUrl) window.open(viewerUrl, '_blank', 'noopener')
  })

  // ------------------------------------------------------------------
  // 会话装配
  // ------------------------------------------------------------------

  var session = null
  var busy = false
  /** 已经进到终端里了。hub:session 变成已登录时据此判断要不要补一次启动。 */
  var started = false

  function readFs() {
    var holder = document.getElementById('puzzle-fs')
    var raw = (holder.textContent || '').trim()
    if (!holder.dataset.enc) return JSON.parse(raw)
    return JSON.parse(PuzzleCore.decodePayload(raw, FS_KEY))
  }

  function applyEffects(effects) {
    for (var i = 0; i < effects.length; i++) {
      var effect = effects[i]
      if (effect.type === 'viewer') openViewer(effect.file)
      else if (effect.type === 'submit-email') void submitEmail(effect.email)
      else if (effect.type === 'refuse') showDenied()
      else if (effect.type === 'halt') el.input.disabled = true
    }
  }

  async function submitEmail(email) {
    busy = true
    el.input.disabled = true

    var state = session.state()
    var outcome
    try {
      var result = await CEA.submit({
        payload: {
          // 管理端列表里显示的摘要行；纯文本渲染，别塞标记
          $display: email + ' · mini puzzle 通过',
          email: email,
          user: state.user,
          puzzle: '2026-recruitment-mini-puzzle',
          commands_used: state.commands,
          elapsed_ms: Date.now() - startedAt,
        },
        kind: 'puzzle',
        /*
          幂等键标识**一次提交意图**：进入邮箱阶段时生成一次，成功后重新生成。
          每次重输邮箱都换新键的话，网络重传就会被当成两次不同的提交。
        */
        idempotencyKey: intentKey,
      })

      var submission = result && result.submission ? result.submission : {}
      outcome = { ok: true, id: submission.id }

      intentKey = newUuid()
      await CEA.storage
        .save('passed', { email: email, submissionId: submission.id, at: Date.now() })
        .catch(function () {})
      CEA.toast('迷你解谜已通过，提交编号 #' + submission.id, 'ok')
    } catch (error) {
      outcome = { ok: false, code: error && error.code, message: error && error.message }
    }

    busy = false
    el.input.disabled = false
    var outcome2 = session.resolveSubmit(outcome)
    appendLines(outcome2.lines)
    applyEffects(outcome2.effects)
    refreshPrompt()
  }

  function refreshPrompt() {
    setPromptView(session.prompt())
    renderLine()
  }

  function newUuid() {
    if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') return crypto.randomUUID()
    return 'k' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12)
  }

  var intentKey = ''
  var startedAt = Date.now()

  function showDenied() {
    /*
      退回拒绝页时**要把这一局丢掉**：`started` 不清掉的话，登出之后再登录时
      hub:session 那条分支会因为 `started === true` 直接返回，页面永远停在拒绝页上
      —— 表现成"重新登录了却进不去"，而唯一的出路是手动刷新。

      丢掉这一局也是对的：身份都换了，上一局解到哪一步不该延续。
    */
    started = false
    session = null
    busy = false
    el.term.hidden = true
    el.denied.hidden = false
    el.viewer.hidden = true
  }

  /*
    终端整屏只有输出区 —— 不再有标题栏。登录态不必另找地方显示：提示符里的用户名
    就是"你现在是谁"，那是终端自己的表达方式，比在角落加一行字更贴题。
  */
  function showTerminal() {
    el.denied.hidden = true
    el.term.hidden = false
    el.input.focus()
    scrollToEnd()
  }

  // ------------------------------------------------------------------
  // 键盘
  // ------------------------------------------------------------------

  el.input.addEventListener('keydown', function (event) {
    if (event.key === 'Enter') {
      event.preventDefault()
      if (busy) return
      submit()
      return
    }

    if (event.key === 'c' && event.ctrlKey) {
      event.preventDefault()
      if (busy) return
      echoInput(currentPrompt.masked)
      appendLine({ text: '^C', tone: 'dim' })
      el.input.value = ''
      var cancelled = session.cancel()
      appendLines(cancelled.lines)
      applyEffects(cancelled.effects)
      refreshPrompt()
      return
    }

    if (event.key === 'l' && event.ctrlKey) {
      event.preventDefault()
      el.out.textContent = ''
      return
    }

    if (event.key === 'Tab') {
      // 不实现补全，但也别让 Tab 把焦点移走 —— 终端里焦点跑了会很困惑
      event.preventDefault()
      return
    }
  })

  /*
    光标块要跟着真实光标走，所以凡是可能改变"输入内容或光标位置"的动作都要重画：
    敲键、左右移动、鼠标点击定位、选中。只监听 input 的话，用左右键编辑时光标块会停在
    原地不动。
  */
  for (const eventName of ['input', 'keyup', 'click', 'select', 'focus']) {
    el.input.addEventListener(eventName, renderLine)
  }

  // 上下键翻历史
  var historyAt = -1
  el.input.addEventListener('keydown', function (event) {
    if (event.key !== 'ArrowUp' && event.key !== 'ArrowDown') {
      historyAt = -1
      return
    }
    if (!session) return
    var history = session.state().history
    if (!history.length) return
    event.preventDefault()

    if (event.key === 'ArrowUp') historyAt = historyAt === -1 ? history.length - 1 : Math.max(0, historyAt - 1)
    else historyAt = historyAt === -1 ? -1 : Math.min(history.length - 1, historyAt + 1)

    el.input.value = historyAt === -1 ? '' : history[historyAt]
    renderLine()
  })

  function submit() {
    var value = el.input.value
    echoInput(currentPrompt.masked)
    el.input.value = ''
    renderLine()

    var outcome = session.run(value)
    appendLines(outcome.lines)
    applyEffects(outcome.effects)
    refreshPrompt()
  }

  // 终端里点哪儿都该聚焦输入框
  el.screen.addEventListener('mousedown', function (event) {
    if (event.target.closest && event.target.closest('.viewer')) return
    if (el.input.disabled) return
    // 让双击选词仍然可用
    if (window.getSelection && String(window.getSelection())) return
    setTimeout(function () { el.input.focus() }, 0)
  })

  el.input.addEventListener('focus', function () { el.term.classList.remove('term--blur') })
  el.input.addEventListener('blur', function () { el.term.classList.add('term--blur') })

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && !el.viewer.hidden) closeViewer()
  })

  el.deniedLogin.addEventListener('click', function () {
    // 只接受站内路径；外部地址会被宿主忽略
    CEA.navigate('/login')
  })

  // ------------------------------------------------------------------
  // 启动
  // ------------------------------------------------------------------

  /*
    登录态变化时宿主会主动下发 hub:session，但 SDK 只更新它自己的描述符、不通知页面。
    所以这里自己听一遍：

      - 变为**未登录**：立刻退回拒绝页。玩到一半登出时，不能让一个已经失效的身份继续玩。
      - 变为**已登录**：如果之前停在拒绝页上，就接着启动。正常流程里玩家会走
        /login 再回来（那是整页重载），但调试台与"另一个标签页里登录"都属于同一种情况，
        没理由要求他手动刷新。

    用**窗口引用**判定来源：不透明源下 event.origin 恒为 "null"，拿它鉴权没有意义。
  */
  window.addEventListener('message', function (event) {
    if (event.source !== window.parent) return
    var data = event.data
    if (!data || typeof data !== 'object' || data.type !== 'hub:session') return
    var identity = data.payload && data.payload.identity
    if (!identity) return
    if (identity.loggedIn === false) showDenied()
    else if (!started) launch(identity)
  })

  /*
    启动。

    **必须是有名字的函数声明**，不能写成 `(async function boot(){…})()`：那样 boot 只
    存在于它自己的作用域里，下面 hub:session 那句 `launch()` 会抛 ReferenceError ——
    而它发生在消息回调里，页面既不报错也不前进，表现为"登录了但终端不出来"。

    身份取值的顺序是有讲究的：

      1. `freshIdentity`：hub:session 直接带过来的那一份，最新
      2. `CEA.identity()`：SDK 维护的实时描述符，登录态变化时它会更新
      3. `await CEA.ready`：只在首次启动、上面两个都还没有时用

    第 3 条**不能**当成唯一来源：`CEA.ready` 是**一次性**的 promise，它兑现的是握手那一刻
    的身份。登录后再回来时它会给出旧的 `loggedIn: false`，页面于是又渲染成拒绝页 ——
    这个坑踩过一次，表现为"点了登录、推了会话，终端还是不出来"。
  */
  async function boot(freshIdentity) {
    if (started) return
    /*
      SDK 没到位时，下面的 CEA.ready 会抛 ReferenceError，异步函数里它变成没人接的
      rejection：整页停在白屏上，既不报错也不前进。先明确报出来。
    */
    if (typeof CEA === 'undefined') {
      el.denied.hidden = false
      el.denied.querySelector('h1').textContent = '页面没能初始化'
      el.denied.querySelector('p').textContent =
        '没有取到桥接脚本 /sdk/v1/cea.js。若是自己部署的实例，请确认前端产物里有这个文件。'
      el.deniedLogin.hidden = true
      return
    }

    var identity = freshIdentity || CEA.identity()
    if (!identity) {
      try {
        identity = await CEA.ready
      } catch (error) {
        el.denied.hidden = false
        el.denied.querySelector('h1').textContent = '这一页要在活动平台里打开'
        el.denied.querySelector('p').textContent =
          '当前页面没有收到宿主的握手响应。请从活动入口进入，而不是直接打开内容地址。'
        el.deniedLogin.hidden = true
        return
      }
    }

    /*
      **这一页只对已登录成员开放。**
      平台侧的活动配置（需登录）才是权威 —— 未登录时宿主会在发出请求之前就把提交
      短路成 login_required；这里的判断是体验层的：不让人填完邮箱才发现交不上去。
    */
    if (!identity.loggedIn) {
      showDenied()
      return
    }

    var fs
    try {
      fs = readFs()
    } catch (error) {
      showDenied()
      el.denied.querySelector('h1').textContent = '页面内容读取失败'
      el.denied.querySelector('p').textContent = String((error && error.message) || error)
      el.deniedLogin.hidden = true
      return
    }

    // 已经交过联系方式的，直接以 self 进入，不再问邮箱
    var passed = await CEA.storage.load('passed').catch(function () { return null })
    var startUser = passed ? 'self' : fs.user
    var submissionId = passed && passed.submissionId != null ? passed.submissionId : null

    session = PuzzleCore.createSession(fs, {
      startUser: startUser,
      passed: passed != null,
      submissionId: submissionId,
    })
    intentKey = newUuid()
    startedAt = Date.now()

    showTerminal()
    appendLines(session.start().lines)
    refreshPrompt()
    started = true
  }

  /**
   * 起一次启动流程，并把启动阶段的意外**说出来**。
   *
   * 不接这个 rejection 的话，启动里任何一处抛错都表现为一片空白 —— 作者与玩家都
   * 无从判断发生了什么，而这正是 docs/bridge-protocol.md 里那条"就绪诊断"要避免的。
   */
  function launch(freshIdentity) {
    boot(freshIdentity).catch(function (error) {
      el.denied.hidden = false
      el.denied.querySelector('h1').textContent = '页面没能启动'
      el.denied.querySelector('p').textContent = String((error && error.message) || error)
      el.deniedLogin.hidden = true
    })
  }

  launch()
})();
</script>

</body>
</html>
