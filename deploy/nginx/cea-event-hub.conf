# CEA 活动平台 —— nginx 站点配置
#
# 这份文件承载四条相互配合的约束，任何一条写错都会静默破坏某项隔离：
#
#   1. /api/ 与 /content/ 反代到后端；/data/ 必须硬拒绝
#   2. /content 与 /api 的 CORS 头不对称（见下方说明）
#   3. 限流分两层，这里是第一层
#   4. SPA 需要 history fallback
#
# 部署前用 `nginx -t` 校验。

# ---------------------------------------------------------------------------
# 限流区（http {} 上下文）
#
# limit_req_zone 用共享内存，因此天然跨 worker 生效——这正是它比应用层内存
# 限流更可靠的地方，也是两层分工的基础：
#   nginx   按客户端 IP，最早、最省、跨 worker
#   FastAPI 按 IP 与**登录用户**，能识别身份（nginx 看不到会话）
# ---------------------------------------------------------------------------

# 一般接口
limit_req_zone $binary_remote_addr zone=cea_general:10m rate=20r/s;
# 提交类端点：更严格
limit_req_zone $binary_remote_addr zone=cea_submit:10m rate=1r/s;
# 认证类端点：防口令爆破
limit_req_zone $binary_remote_addr zone=cea_auth:10m rate=0.5r/s;

# 默认是 503，语义不对：限流是"你太快了"，不是"服务不可用"。
limit_req_status 429;
limit_req_log_level warn;

# ---------------------------------------------------------------------------
# 若前面还有 CDN，必须先做真实 IP 还原，否则 $binary_remote_addr 拿到的是
# CDN 的地址 —— 限流要么形同虚设，要么把整个 CDN 一起封掉。
# 把下面三行的网段换成实际 CDN 的出口段后取消注释：
#
#   set_real_ip_from 173.245.48.0/20;
#   set_real_ip_from 103.21.244.0/22;
#   real_ip_header X-Forwarded-For;
#   real_ip_recursive on;
#
# 同时后端启动参数里的 --forwarded-allow-ips 必须与这里保持一致，
# 否则应用层会忽略 nginx 写入的 X-Forwarded-For。
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name _;

    # SPA 构建产物。SDK 作为独立构建入口产出到 dist/sdk/v1/cea.js，
    # 因此 /sdk/ 也由这里直出。
    root /srv/cea/spa;
    index index.html;

    charset utf-8;

    # 与后端 MAX_REQUEST_BYTES 保持一致：这里是第一道体积闸，
    # 但应用层必须独立再验一遍（绝不信任边缘）。
    client_max_body_size 64m;

    # 基础的响应头加固。注意 Content-Security-Policy 刻意不在这里设置：
    # 活动页是自行编写的 HTML，强 CSP 会大面积打断既有活动页；
    # 隔离由 iframe 沙箱承担，而不是靠 CSP。
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # -----------------------------------------------------------------------
    # 认证类接口：最严格的一档
    # -----------------------------------------------------------------------
    location /api/v1/auth/ {
        limit_req zone=cea_auth burst=5 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------------------------------------------------------
    # 提交类端点：次严格
    #
    # 注意这里**不加任何 CORS 响应头**。/api/** 必须保持无 CORS 头，
    # 否则沙箱活动页可以绕过宿主桥接直接调用后端（design.md 决策 5）。
    # -----------------------------------------------------------------------
    location ~ ^/api/v1/events/[^/]+/submissions {
        limit_req zone=cea_submit burst=5 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上传可能较慢，给足超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # -----------------------------------------------------------------------
    # 其余 API
    # -----------------------------------------------------------------------
    location /api/ {
        limit_req zone=cea_general burst=40 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------------------------------------------------------
    # 活动网页内容：公开只读
    #
    # ACAO 由后端（ContentStaticFiles）设置，这里不再叠加，避免出现两个
    # 不一致的值。刻意不在这里加 add_header 的原因：add_header 在 location
    # 层会覆盖继承，容易把后端设的头弄丢。
    # -----------------------------------------------------------------------
    location /content/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # -----------------------------------------------------------------------
    # 上传的附件：绝不静态暴露
    #
    # 后端根本没有挂载这个前缀，这里再明确拒绝一次，防止将来有人"顺手"
    # 加一条静态映射。附件的唯一读取路径是鉴权下载端点。
    # -----------------------------------------------------------------------
    location /data/ {
        return 404;
    }

    # -----------------------------------------------------------------------
    # SDK：经典脚本，由 SPA 产物直出
    # -----------------------------------------------------------------------
    location /sdk/ {
        # 经典脚本的 <script src> 不受 CORS 限制；这里仍然给出通配头，
        # 以便将来改用 ES module 时不必再改配置。
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # -----------------------------------------------------------------------
    # 带哈希的构建产物：可长期缓存
    # -----------------------------------------------------------------------
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # -----------------------------------------------------------------------
    # SPA history fallback
    #
    # /admin/**、/login、/{event_id} 都归前端路由，服务端对未知路径回退到
    # 应用入口。入口本身不缓存，否则前端发版后用户会一直拿到旧壳。
    # -----------------------------------------------------------------------
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
