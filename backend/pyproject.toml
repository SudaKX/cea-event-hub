[project]
name = "cea-event-hub-backend"
version = "0.1.0"
description = "CEA 社团活动网站后端：活动托管、信息收集与审核"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    # 测试里用假模块替身来验装配，因此不需要真的装 resend
]
# Resend 发信。列为可选：console 与 smtp 部署不该被一个用不到的包拖着
resend = [
    "resend>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]
